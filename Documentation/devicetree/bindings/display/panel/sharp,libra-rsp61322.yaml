%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/sharp,libra-rsp61322.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Mi 4C Sharp RSP61322 1080p video-mode panel

maintainers:
  - Konrad Dybcio <konradybcio@kernel.org>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: sharp,libra-rsp61322
  reg:
    maxItems: 1
  avdd-supply:
    description: Positive 5.5 V panel bias (LAB).
  avee-supply:
    description: Negative 5.5 V panel bias (IBB).
  reset-gpios:
    maxItems: 1
    description: Active-low panel reset.
  enable-gpios:
    maxItems: 1
  backlight: true
  port: true

required:
  - compatible
  - reg
  - avdd-supply
  - avee-supply
  - reset-gpios
  - enable-gpios
  - backlight
  - port

unevaluatedProperties: false
