%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,msm8992-cpu-aux-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8992 CPU auxiliary clock

maintainers:
  - Konrad Dybcio <konradybcio@kernel.org>

description: |
  Fixed auxiliary GPLL0 clock path used for CPU cold-boot bring-up, without
  CPU PLL scaling or regulator/CPR voltage control. The ACC boot code selects
  this path before releasing secondary CPUs.

properties:
  compatible:
    const: qcom,msm8992-cpu-aux-clock
  clocks:
    maxItems: 1
  clock-names:
    const: aux
  '#clock-cells':
    const: 0

required:
  - compatible
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false
