%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,msm8992-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8992 20nm PCIe QMP PHY

maintainers:
  - Libra maintainers <codex@openai.com>

description: |
  The 19.2 MHz PCIe PHY exports a 125 MHz PIPE clock to GCC. The GCC
  gated PIPE clock is enabled only after the factory calibration sequence.

properties:
  compatible:
    const: qcom,msm8992-pcie-phy
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: pipe
  resets:
    maxItems: 1
  reset-names:
    const: pipe
  '#phy-cells':
    const: 0
  '#clock-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - '#phy-cells'
  - '#clock-cells'

additionalProperties: false
...
