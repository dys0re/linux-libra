%YAML 1.2
---
$id: http://devicetree.org/schemas/power/qcom,msm8992-saw-vctl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8992 SAW voltage-control register bank

maintainers:
  - Konrad Dybcio <konradybcio@kernel.org>

description: |
  The system/CCI SAW controls the A53 APC supply; the A57 L2 SAW controls
  the A57 APC supply. The regulator uses the factory port-0 voltage path.
  This register-bank description does not enable CPU idle or suspend modes.

properties:
  compatible:
    items:
      - const: qcom,msm8992-saw-vctl
      - const: syscon

  reg:
    maxItems: 1

  qcom,saw2-spm-dly:
    description: Factory SPM delay configuration, applied on the first voltage request
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0x3c100c00, 0x3c100c30]

required:
  - compatible
  - reg
  - qcom,saw2-spm-dly

additionalProperties: false
